<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Radar Viewer — Web Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #050510;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(100, 100, 200, 0.15);
      flex-shrink: 0;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      color: #e0e0ff;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .brand .icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00d4ff, #0066ff);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
      display: inline-block;
      position: relative;
    }

    .brand .icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 60%; height: 2px;
      background: rgba(255,255,255,0.8);
      transform: translate(-50%, -50%) rotate(45deg);
      border-radius: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .controls input {
      background: rgba(20, 20, 50, 0.6);
      border: 1px solid rgba(100, 100, 200, 0.25);
      color: #ccd0ff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: "SF Mono", Monaco, monospace;
      outline: none;
      width: 130px;
      transition: border-color 0.2s;
    }

    .controls input:focus {
      border-color: #00d4ff;
    }

    .controls input#port { width: 60px; }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0066ff, #00aaff);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 100, 255, 0.3);
    }

    .btn-primary:hover { background: linear-gradient(135deg, #0055ee, #0099ee); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-danger {
      background: linear-gradient(135deg, #ff4444, #ff6666);
      color: #fff;
      box-shadow: 0 2px 8px rgba(255, 68, 68, 0.3);
    }

    .btn-small {
      padding: 4px 10px;
      font-size: 12px;
      background: rgba(30, 30, 70, 0.6);
      border: 1px solid rgba(100, 100, 200, 0.2);
      color: #aab;
    }

    .btn-small:hover { background: rgba(50, 50, 100, 0.6); color: #fff; }
    .btn-small:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Main ── */
    .main {
      flex: 1;
      position: relative;
      min-height: 0;
      background: #0a0a14;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    /* 危险报警动画 */
    .danger-alert {
      animation: dangerPulse 1.2s infinite;
    }

    @keyframes dangerPulse {
      0%, 100% { box-shadow: inset 0 0 0 rgba(255, 0, 0, 0); }
      50% { box-shadow: inset 0 0 60px rgba(255, 50, 50, 0.15); }
    }

    /* ── Overlays ── */
    .overlay {
      position: absolute;
      background: rgba(15, 15, 40, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 100, 200, 0.15);
      border-radius: 10px;
      padding: 12px 16px;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s;
    }

    .temp-overlay {
      top: 16px;
      right: 16px;
      text-align: right;
      min-width: 110px;
    }

    .temp-overlay .label {
      font-size: 11px;
      color: #8899bb;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .temp-overlay .value {
      font-size: 22px;
      font-weight: 700;
      color: #ff8844;
      font-family: "SF Mono", Monaco, monospace;
      text-shadow: 0 0 10px rgba(255, 136, 68, 0.3);
    }

    .stats-overlay {
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 150px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #aab;
    }

    .stat .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .stat b {
      color: #fff;
      font-family: "SF Mono", Monaco, monospace;
      margin-left: 2px;
    }

    .status-overlay {
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #8899bb;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      box-shadow: 0 0 6px currentColor;
      transition: all 0.3s;
    }

    .status-dot.connected { background: #44ff44; box-shadow: 0 0 8px #44ff44; }
    .status-dot.connecting { background: #ffaa00; animation: blink 1s infinite; }
    .status-dot.error { background: #ff4444; box-shadow: 0 0 8px #ff4444; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(100, 100, 200, 0.15);
      font-size: 12px;
      color: #7788aa;
      flex-shrink: 0;
      gap: 12px;
    }

    .footer-left, .footer-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-right { gap: 8px; }

    .badge {
      font-family: "SF Mono", Monaco, monospace;
      background: rgba(20, 20, 50, 0.5);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(100, 100, 200, 0.1);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .header { flex-direction: column; align-items: stretch; }
      .controls { justify-content: stretch; }
      .controls input { flex: 1; }
      .brand { font-size: 16px; }
      .temp-overlay .value { font-size: 18px; }
      .overlay { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="brand">
      <span class="icon"></span>
      <span>ESP32 Radar Viewer</span>
    </div>
    <div class="controls">
      <input type="text" id="ipInput" value="192.168.1.100" placeholder="IP 地址" title="ESP32 IP 地址">
      <input type="number" id="portInput" value="81" placeholder="端口" title="WebSocket 端口">
      <button id="connectBtn" class="btn btn-primary">连接</button>
    </div>
  </header>

  <main class="main" id="mainContainer">
    <div id="chart"></div>

    <div class="overlay status-overlay">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>

    <div class="overlay temp-overlay">
      <div class="label">环境温度</div>
      <div class="value" id="tempDisplay">--°C</div>
    </div>

    <div class="overlay stats-overlay">
      <div class="stat">
        <span class="dot" style="background:#00d4ff"></span>
        <span>点数 <b id="statPoints">0 / 0</b></span>
      </div>
      <div class="stat">
        <span class="dot" style="background:#ff4444"></span>
        <span>危险 <b id="statDanger">0</b> (&lt;1m)</span>
      </div>
      <div class="stat">
        <span class="dot" style="background:#44ff44"></span>
        <span>安全 <b id="statSafe">0</b> (1-6m)</span>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-left">
      <span class="badge" id="fpsBadge">FPS: 0</span>
      <span class="badge" id="latencyBadge">延迟: --ms</span>
      <span class="badge" id="wsUrlDisplay">WS: --</span>
    </div>
    <div class="footer-right">
      <button id="recordBtn" class="btn btn-small">⏺ 开始记录</button>
      <button id="exportBtn" class="btn btn-small" disabled>⬇ 导出 JSON</button>
      <button id="soundBtn" class="btn btn-small">🔇 音效关闭</button>
    </div>
  </footer>
</div>

<script>
/**
 * ESP32 Radar Viewer — Web Edition
 * 功能完全对齐 Python 原版，并增加扫描线、历史拖尾、数据录制、音效报警等增强特性
 */

const CONFIG = {
  DANGER_MM: 1000,
  SAFE_MM: 6000,
  MAX_MM: 6900,        // 1.15 * SAFE_MM，与 Python 的 ylim 一致
  HISTORY_FRAMES: 4,   // 拖尾历史帧数
  COLORS: {
    danger: '#ff4444',
    safe:   '#44ff44',
    warn:   '#ffaa00',
    grid:   '#222244',
    text:   '#cccccc',
    accent: '#00d4ff'
  }
};

// ── DOM 引用 ──
const els = {
  ip:          document.getElementById('ipInput'),
  port:        document.getElementById('portInput'),
  connectBtn:  document.getElementById('connectBtn'),
  statusDot:   document.getElementById('statusDot'),
  statusText:  document.getElementById('statusText'),
  temp:        document.getElementById('tempDisplay'),
  statPoints:  document.getElementById('statPoints'),
  statDanger:  document.getElementById('statDanger'),
  statSafe:    document.getElementById('statSafe'),
  fps:         document.getElementById('fpsBadge'),
  latency:     document.getElementById('latencyBadge'),
  wsUrl:       document.getElementById('wsUrlDisplay'),
  recordBtn:   document.getElementById('recordBtn'),
  exportBtn:   document.getElementById('exportBtn'),
  soundBtn:    document.getElementById('soundBtn'),
  main:        document.getElementById('mainContainer')
};

// ── 状态 ──
let chart;
let ws = null;
let reconnectTimer = null;
let isConnected = false;
let isRecording = false;
let recordedData = [];
let soundEnabled = false;
let audioCtx = null;
let frameTimes = [];
let lastTs = 0;
let scanAngle = 0;
let historyFrames = [];   // 拖尾数据缓冲
let scanInterval = null;

// ── 初始化图表 ──
function initChart() {
  chart = echarts.init(document.getElementById('chart'), null, {
    renderer: 'canvas'
  });

  // 生成虚线圆数据 (0~360°，每 5° 一个点)
  const circleData = step => Array.from({length: 73}, (_, i) => ({ value: [i * 5, step] }));

  const option = {
    backgroundColor: 'transparent',
    animation: false,
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(10,10,30,0.9)',
      borderColor: '#333366',
      textStyle: { color: '#ccd0ff', fontSize: 12 },
      formatter: p => {
        const deg = p.value[0].toFixed(1);
        const m = (p.value[1] / 1000).toFixed(2);
        return `角度: ${deg}°<<br>距离: ${m}m`;
      }
    },
    polar: {
      radius: '72%',
      center: ['50%', '50%']
    },
    angleAxis: {
      type: 'value',
      startAngle: 90,          // 0° 在正北（12 点钟）
      clockwise: true,         // 顺时针增加，与 Python theta_direction(-1) 一致
      min: 0,
      max: 360,
      axisLine: { lineStyle: { color: CONFIG.COLORS.grid, width: 1 } },
      axisLabel: {
        color: CONFIG.COLORS.text,
        fontSize: 11,
        formatter: '{value}°'
      },
      splitLine: { lineStyle: { color: CONFIG.COLORS.grid, opacity: 0.5, width: 0.5 } }
    },
    radiusAxis: {
      min: 0,
      max: CONFIG.MAX_MM,
      axisLine: { show: false },
      axisLabel: {
        color: CONFIG.COLORS.text,
        fontSize: 11,
        formatter: v => (v / 1000).toFixed(0) + 'm'
      },
      splitLine: { lineStyle: { color: CONFIG.COLORS.grid, opacity: 0.4, width: 0.5 } }
    },
    series: [
      // 0. 危险区填充 0-1m (红色半透明)
      {
        type: 'custom',
        coordinateSystem: 'polar',
        z: 1,
        silent: true,
        data: [[0, 0, CONFIG.DANGER_MM]],
        renderItem: (params, api) => renderZone(api, 0, CONFIG.DANGER_MM, 'rgba(255,68,68,0.08)')
      },
      // 1. 安全区填充 1-6m (绿色半透明)
      {
        type: 'custom',
        coordinateSystem: 'polar',
        z: 1,
        silent: true,
        data: [[0, CONFIG.DANGER_MM, CONFIG.SAFE_MM]],
        renderItem: (params, api) => renderZone(api, CONFIG.DANGER_MM, CONFIG.SAFE_MM, 'rgba(68,255,68,0.04)')
      },
      // 2. 1m 危险边界虚线
      {
        type: 'line',
        coordinateSystem: 'polar',
        data: circleData(CONFIG.DANGER_MM),
        symbol: 'none',
        lineStyle: { color: CONFIG.COLORS.danger, type: [4, 4], opacity: 0.35, width: 1.2 },
        z: 2,
        silent: true,
        animation: false
      },
      // 3. 扫描线
      {
        id: 'scanline',
        type: 'line',
        coordinateSystem: 'polar',
        data: [[0, 0], [0, CONFIG.MAX_MM]],
        symbol: 'none',
        lineStyle: {
          color: 'rgba(0, 212, 255, 0.25)',
          width: 2,
          shadowBlur: 10,
          shadowColor: 'rgba(0, 212, 255, 0.4)'
        },
        z: 3,
        silent: true,
        animation: false
      },
      // 4~7. 历史拖尾 (由旧到新)
      ...Array.from({length: CONFIG.HISTORY_FRAMES}, (_, i) => ({
        id: `hist${i}`,
        type: 'scatter',
        coordinateSystem: 'polar',
        data: [],
        symbolSize: 6,
        itemStyle: {
          color: p => getDistanceColor(p.value[1]),
          opacity: 0.08 + i * 0.04
        },
        z: 4 + i,
        silent: true,
        animation: false
      })),
      // 8. 当前帧散点 (主数据)
      {
        id: 'scatter',
        type: 'scatter',
        coordinateSystem: 'polar',
        data: [],
        symbolSize: 10,
        itemStyle: {
          color: p => getDistanceColor(p.value[1]),
          shadowBlur: 6,
          shadowColor: p => getDistanceColor(p.value[1]) + '60'
        },
        emphasis: {
          scale: 1.5,
          itemStyle: { shadowBlur: 15, shadowColor: 'rgba(255,255,255,0.5)' }
        },
        z: 10,
        animation: false
      }
    ]
  };

  chart.setOption(option);

  // 扫描线动画
  scanInterval = setInterval(() => {
    scanAngle = (scanAngle + 2) % 360;
    chart.setOption({
      series: [{ id: 'scanline', data: [[scanAngle, 0], [scanAngle, CONFIG.MAX_MM]] }]
    });
  }, 40);

  window.addEventListener('resize', () => chart.resize());
}

// ── 绘制扇形环 (对应 Python fill_between) ──
function renderZone(api, innerR, outerR, color) {
  const steps = 72; // 每 5° 采样，足够平滑
  const points = [];
  for (let i = 0; i <= steps; i++) {
    const a = i * 360 / steps;
    points.push(api.coord([a, outerR]));
  }
  for (let i = steps; i >= 0; i--) {
    const a = i * 360 / steps;
    points.push(api.coord([a, innerR]));
  }
  return {
    type: 'polygon',
    shape: { points },
    style: { fill: color },
    silent: true
  };
}

// ── 距离→颜色映射 (RdYlGn: 近红 → 远绿) ──
function getDistanceColor(d) {
  const t = Math.min(Math.max(d / CONFIG.SAFE_MM, 0), 1);
  let r, g, b;
  if (t < 0.5) {
    const s = t * 2;
    r = 255;
    g = Math.round(68 + 102 * s);
    b = Math.round(68 * (1 - s));
  } else {
    const s = (t - 0.5) * 2;
    r = Math.round(255 - 187 * s);
    g = Math.round(170 + 85 * s);
    b = Math.round(68 * s);
  }
  return `rgb(${r},${g},${b})`;
}

// ── WebSocket 管理 ──
function toggleConnection() {
  if (isConnected) {
    disconnect();
  } else {
    connect();
  }
}

function connect() {
  const ip = els.ip.value.trim();
  const port = parseInt(els.port.value, 10) || 81;
  const url = `ws://${ip}:${port}/`;

  // 保存设置
  localStorage.setItem('radar_ip', ip);
  localStorage.setItem('radar_port', port);

  setStatus('connecting', '连接中...');
  els.wsUrl.textContent = `WS: ${ip}:${port}`;
  els.connectBtn.textContent = '断开';
  els.connectBtn.classList.remove('btn-primary');
  els.connectBtn.classList.add('btn-danger');

  try {
    ws = new WebSocket(url);
    ws.onopen = () => {
      isConnected = true;
      setStatus('connected', '已连接');
      reconnectTimer = null;
    };
    ws.onmessage = evt => {
      try {
        const data = JSON.parse(evt.data);
        handleData(data);
      } catch (e) {
        console.warn('Parse error:', e);
      }
    };
    ws.onerror = () => {
      setStatus('error', '连接错误');
    };
    ws.onclose = () => {
      isConnected = false;
      setStatus('error', '已断开');
      els.connectBtn.textContent = '连接';
      els.connectBtn.classList.remove('btn-danger');
      els.connectBtn.classList.add('btn-primary');
      // 自动重连
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(() => {
          if (!isConnected && els.connectBtn.textContent === '断开') {
            connect();
          }
        }, 3000);
      }
    };
  } catch (e) {
    setStatus('error', '连接失败');
    console.error(e);
  }
}

function disconnect() {
  if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
  if (ws) {
    ws.close();
    ws = null;
  }
  isConnected = false;
  setStatus('error', '已断开');
  els.connectBtn.textContent = '连接';
  els.connectBtn.classList.remove('btn-danger');
  els.connectBtn.classList.add('btn-primary');
  els.wsUrl.textContent = 'WS: --';
}

function setStatus(type, text) {
  els.statusDot.className = 'status-dot ' + type;
  els.statusText.textContent = text;
}

// ── 数据处理 ──
function handleData(data) {
  const now = performance.now();

  // 计算延迟 (若 ESP32 返回微秒级 ts)
  if (data.ts && lastTs) {
    const dt = (data.ts - lastTs) / 1000; // μs → ms 近似
    els.latency.textContent = `帧间隔: ${dt.toFixed(0)}ms`;
  }
  if (data.ts) lastTs = data.ts;

  // 解析向量 (过滤无效数据，与 Python 一致)
  const vectors = (data.vectors || []).filter(v => v.d > 0 && !isNaN(v.d) && v.d <= CONFIG.SAFE_MM);
  const allCount = (data.vectors || []).length;
  const points = vectors.map(v => ({ value: [v.a, v.d] }));

  // 统计
  const danger = points.filter(p => p[1] <= CONFIG.DANGER_MM).length;
  const safe = points.filter(p => p[1] > CONFIG.DANGER_MM).length;

  // 更新 DOM 面板
  els.temp.textContent = (data.temp != null && !isNaN(data.temp)) ? data.temp.toFixed(1) + '°C' : '--°C';
  els.statPoints.textContent = `${points.length} / ${allCount}`;
  els.statDanger.textContent = danger;
  els.statSafe.textContent = safe;

  // 危险报警
  if (danger > 0) {
    els.main.classList.add('danger-alert');
    if (soundEnabled) playAlert();
  } else {
    els.main.classList.remove('danger-alert');
  }

  // 历史拖尾: 移位旧数据
  historyFrames.push(points);
  if (historyFrames.length > CONFIG.HISTORY_FRAMES) historyFrames.shift();

  // 组装 series 更新
  const seriesUpdate = [];
  historyFrames.forEach((frame, i) => {
    seriesUpdate.push({
      id: `hist${i}`,
      data: frame
    });
  });
  seriesUpdate.push({
    id: 'scatter',
    data: points
  });

  chart.setOption({ series: seriesUpdate });

  // 录制
  if (isRecording) {
    recordedData.push({
      receivedAt: Date.now(),
      ...data
    });
    if (recordedData.length > 10000) recordedData.shift(); // 防止内存爆炸
  }

  // FPS 计算
  frameTimes.push(now);
  while (frameTimes.length > 0 && frameTimes[0] < now - 1000) frameTimes.shift();
  els.fps.textContent = `FPS: ${frameTimes.length}`;
}

// ── 音效报警 (Web Audio API) ──
function playAlert() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
  osc.type = 'square';

  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

// ── 录制与导出 ──
function toggleRecord() {
  isRecording = !isRecording;
  els.recordBtn.textContent = isRecording ? '⏹ 停止记录' : '⏺ 开始记录';
  els.recordBtn.style.color = isRecording ? '#ff4444' : '';
  els.exportBtn.disabled = !isRecording && recordedData.length === 0;
  if (isRecording && recordedData.length === 0) {
    // 开始新录制，清空旧数据
    recordedData = [];
  }
}

function exportData() {
  if (recordedData.length === 0) return;
  const blob = new Blob([JSON.stringify(recordedData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const date = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.download = `radar_data_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── 事件绑定 ──
function initEvents() {
  els.connectBtn.addEventListener('click', toggleConnection);
  els.recordBtn.addEventListener('click', toggleRecord);
  els.exportBtn.addEventListener('click', exportData);
  els.soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    els.soundBtn.textContent = soundEnabled ? '🔊 音效开启' : '🔇 音效关闭';
    els.soundBtn.style.color = soundEnabled ? '#44ff44' : '';
    if (soundEnabled && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  });

  // 加载保存的 IP/端口
  const savedIp = localStorage.getItem('radar_ip');
  const savedPort = localStorage.getItem('radar_port');
  if (savedIp) els.ip.value = savedIp;
  if (savedPort) els.port.value = savedPort;

  // 回车连接
  [els.ip, els.port].forEach(el => {
    el.addEventListener('keypress', e => { if (e.key === 'Enter') connect(); });
  });
}

// ── 启动 ──
initChart();
initEvents();
</script>
