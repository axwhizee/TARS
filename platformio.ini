; PlatformIO Project Configuration File
; ESP32-S3-N16R8 (16MB Flash, 8MB Octal PSRAM) with ESP-IDF

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200

; board_build.filesystem = littlefs     ; 推荐：更现代、支持擦除计数
; board_build.filesystem = spiffs     ; 旧版方案，部分老教程使用

build_flags = 
    -Wall                   ; Turn on all optional warnings which are desirable for normal code.
    -Wextra
    -Wno-unused-function
    -Wno-unused-variable
