<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARS-Console</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">TARS-Console</div>
        <div class="right-info">
            <div class="status disconnected">
                <span class="dot"></span>
                <span id="statusText">未连接</span>
            </div>
            <span class="fps" id="fpsText">0 frame/s</span>
        </div>
    </header>
    <main>
        <canvas id="radar-canvas"></canvas>
        <button id="modeToggle" class="mode-btn">手动</button>
        <div id="configPanel" class="config-panel" style="display:none">
            <div class="config-body">
                <div class="config-col">
                    <h3>APF 斥力</h3>
                    <label>range_rep <input type="number" id="p_range_rep" step="0.01"></label>
                    <label>gain_rep_x <input type="number" id="p_gain_rep_x" step="0.01"></label>
                    <label>gain_rep_y <input type="number" id="p_gain_rep_y" step="0.01"></label>
                    <label>rep_nx <input type="number" id="p_rep_nx" step="0.01"></label>
                    <label>rep_ny <input type="number" id="p_rep_ny" step="0.01"></label>
                    <label>att_base <input type="number" id="p_att_base" step="0.01"></label>
                </div>
                <div class="config-col">
                    <h3>VFH 直方图</h3>
                    <label>vfh_thresh <input type="number" id="p_vfh_thresh" step="0.01"></label>
                    <label>vfh_min_w <input type="number" id="p_vfh_min_w" step="1"></label>
                    <label>vfh_smooth_w <input type="number" id="p_vfh_smooth_w" step="0.01"></label>
                    <label>vfh_free_th <input type="number" id="p_vfh_free_th" step="0.01"></label>
                    <label>vfh_goal_bias <input type="number" id="p_vfh_goal_bias" step="0.01"></label>
                    <label>vfh_ema_alpha <input type="number" id="p_vfh_ema_alpha" step="0.01"></label>
                </div>
            </div>
            <div class="config-footer">
                <button id="configApply" class="config-apply">应用</button>
                <button id="configReset" class="config-reset">重置</button>
                <button id="configExit" class="config-exit">退出</button>
            </div>
        </div>
        <div class="overlay temp-overlay">
            <div class="label">核心温度</div>
            <div class="value" id="tempDisplay">-- °C</div>
        </div>
        <div class="overlay stats-overlay">
            <div class="stat"><span class="stat-dot c-noise"></span>噪声 <b id="statNoise">0</b></div>
            <div class="stat"><span class="stat-dot c-danger"></span>危险 <b id="statDanger">0</b></div>
            <div class="stat"><span class="stat-dot c-safe"></span>安全 <b id="statSafe">0</b></div>
            <div class="stat"><span class="stat-dot c-total"></span>总计 <b id="statTotal">0</b></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
