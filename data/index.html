<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APF-Ridar Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">APF-Ridar Viewer</div>
        <div class="right-info">
            <div class="status disconnected">
                <span class="dot"></span>
                <span id="statusText">未连接</span>
            </div>
            <span class="fps" id="fpsText">0 frame/s</span>
        </div>
    </header>
    <main>
        <canvas id="radar-canvas"></canvas>
        <div class="overlay temp-overlay">
            <div class="label">环境温度</div>
            <div class="value" id="tempDisplay">-- °C</div>
        </div>
        <div class="overlay stats-overlay">
            <div class="stat"><span class="stat-dot c-noise"></span>噪声 <b id="statNoise">0</b></div>
            <div class="stat"><span class="stat-dot c-danger"></span>危险 <b id="statDanger">0</b></div>
            <div class="stat"><span class="stat-dot c-safe"></span>安全 <b id="statSafe">0</b></div>
            <div class="stat"><span class="stat-dot c-total"></span>总计 <b id="statTotal">0</b></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
